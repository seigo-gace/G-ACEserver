# Non-production probe of the EXISTING 109-line PC source.
# This is an ephemeral, isolated service: no host ports, mounts only the source file.
services:
  gserver-staging:
    image: python:3.12-slim-bookworm
    network_mode: "none"
    read_only: true
    init: true
    user: "65534:65534"
    working_dir: /tmp
    command: ["python3", "-B", "-u", "/opt/gserver.py"]
    environment:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONUNBUFFERED: "1"
    volumes:
      - type: bind
        source: ${GSERVER_SOURCE_FILE:?source_file_required}
        target: /opt/gserver.py
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=16m
    cap_drop: ["ALL"]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 64
    mem_limit: 256m
    cpus: 0.50
    restart: "no"
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; r=urllib.request.urlopen('http://127.0.0.1:8765/health', timeout=2); assert r.status == 200; r.close()"]
      interval: 5s
      timeout: 3s
      start_period: 5s
      retries: 6
