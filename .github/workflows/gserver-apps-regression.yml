name: Gserver independent-app regression
on:
  push:
    branches:
      - chat/gserver-apps-integrate-pr18-20261101
  pull_request:
    paths:
      - scripts/gserver_apps.py
      - scripts/smoke_gserver_apps_host.py
      - scripts/demo_independent_app_lifecycle.py
      - tests/test_gserver_apps.py
      - tests/test_gserver_apps_smoke.py
      - .github/workflows/gserver-apps-regression.yml
permissions:
  contents: read
jobs:
  apps-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Existing apps runtime contract and smoke-unit regression
        run: python3 -B -m unittest discover -s tests -p 'test_gserver_apps*.py' -q
