name: Gserver Bot source regression
on:
  push:
    branches:
      - chat/gserver-bot-spool-stale-ack-20261031
  pull_request:
    paths:
      - app/tgs_bridge.py
      - app/gserver.py
      - scripts/gserverctl.py
      - tests/test_tgs_bridge.py
      - tests/test_runtime.py
      - tests/test_gserver_bot_ready_contract.py
      - .github/workflows/gserver-bot-source-regression.yml
permissions:
  contents: read
jobs:
  bot-source:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Python stdlib tests (Bot spool and local service)
        run: |
          python3 -B -m unittest discover -s tests -p test_tgs_bridge.py -q
          python3 -B -m unittest discover -s tests -p test_runtime.py -q
          python3 -B -m unittest discover -s tests -p test_gserver_bot_ready_contract.py -q
