name: Gserver Access branch one-shot Python checks
on:
  push:
    branches:
      - chat/gserver-access-service-token-20261029
permissions:
  contents: read
jobs:
  access-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Python compile of changed modules and tests
        run: python3 -m py_compile app/tgs_bridge.py app/gserver.py scripts/gserverctl.py tests/test_tgs_bridge.py tests/test_runtime.py
      - name: Gserver Gateway integration unit tests
        run: python3 -m unittest discover -s tests -p 'test_tgs_bridge.py' -v
      - name: Gserver runtime/controller regression
        run: python3 -m unittest discover -s tests -p 'test_runtime.py' -v
